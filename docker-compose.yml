services:
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./backend/src/.env
    volumes:
      # Persist database data
      - database_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - chat-network

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chat-network
    profiles:
      - production

volumes:
  database_data:
    driver: local

networks:
  chat-network:
    driver: bridge